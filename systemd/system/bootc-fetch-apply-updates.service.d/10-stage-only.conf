[Unit]
Description=Fetch and stage bootc updates (without automatic reboot)

[Service]
# Limpa o comando padrão de upstream que utiliza '--apply' (que causa reinicialização automática do sistema)
ExecStart=
# Executa apenas o download e a preparação atômica (staged), aguardando aprovação do usuário para reiniciar
ExecStart=/usr/bin/bootc upgrade --quiet
